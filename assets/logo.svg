<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none" class="h-8 md:h-10 w-auto">
  <!-- Recycling X Icon Mark -->
  <g transform="translate(6, 5)">
    <circle cx="20" cy="20" r="19" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <!-- Upper Left to Lower Right Blade -->
    <path d="M12 12 L28 28" stroke="#059669" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Lower Left to Upper Right Blade -->
    <path d="M12 28 L28 12" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Modern Tech Nodes on X -->
    <circle cx="12" cy="12" r="2.5" fill="#047857"/>
    <circle cx="28" cy="28" r="2.5" fill="#047857"/>
    <circle cx="12" cy="28" r="2.5" fill="#10b981"/>
    <circle cx="28" cy="12" r="2.5" fill="#10b981"/>
  </g>
  <!-- Text Brand -->
  <text x="54" y="32" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#0f172a" letter-spacing="-0.5">Scrap<tspan fill="#059669">X</tspan><tspan fill="#0f172a" font-weight="700">trade</tspan></text>
  <text x="55" y="44" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="7.5" fill="#10b981" letter-spacing="1.8">GLOBAL B2B MARKETPLACE</text>
</svg>

